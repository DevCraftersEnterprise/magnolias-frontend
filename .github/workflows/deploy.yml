name: Deploy Nuxt to Hostinger

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static app
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
        run: npm run generate

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: .output/public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Notify Discord Success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit "$COMMIT_MESSAGE" \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            '{
              "embeds": [
                {
                  "title": "Deploy exitoso",
                  "description": "El despliegue del frontend Nuxt terminó correctamente.",
                  "color": 5763719,
                  "fields": [
                    { "name": "Proyecto", "value": $repo, "inline": true },
                    { "name": "Rama", "value": $branch, "inline": true },
                    { "name": "Autor", "value": $actor, "inline": true },
                    { "name": "Commit", "value": $commit, "inline": false },
                    { "name": "Workflow", "value": $run_url, "inline": false },
                    { "name": "Commit URL", "value": $commit_url, "inline": false }
                  ],
                  "footer": {
                    "text": "DevCrafters CI/CD"
                  },
                  "timestamp": (now | todateiso8601)
                }
              ]
            }' > discord-success.json

          curl -H "Content-Type: application/json" \
               -X POST \
               -d @discord-success.json \
               "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit "$COMMIT_MESSAGE" \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            '{
              "embeds": [
                {
                  "title": "Deploy fallido",
                  "description": "El despliegue del frontend Nuxt falló. Revisa el workflow para ver el error.",
                  "color": 15548997,
                  "fields": [
                    { "name": "Proyecto", "value": $repo, "inline": true },
                    { "name": "Rama", "value": $branch, "inline": true },
                    { "name": "Autor", "value": $actor, "inline": true },
                    { "name": "Commit", "value": $commit, "inline": false },
                    { "name": "Workflow", "value": $run_url, "inline": false },
                    { "name": "Commit URL", "value": $commit_url, "inline": false }
                  ],
                  "footer": {
                    "text": "DevCrafters CI/CD"
                  },
                  "timestamp": (now | todateiso8601)
                }
              ]
            }' > discord-failure.json

          curl -H "Content-Type: application/json" \
               -X POST \
               -d @discord-failure.json \
               "$DISCORD_WEBHOOK_URL"
